version: '3.8'

services:
  backend:
    build: .
    container_name: rafeeq_backend
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: rafeeq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rafeeq_db
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      qdrant:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: rafeeq_db
    environment:
      POSTGRES_USER: rafeeq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rafeeq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rafeeq -d rafeeq_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rafeeq_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: rafeeq_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  qdrant_data:
